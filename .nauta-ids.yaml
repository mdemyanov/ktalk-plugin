# .nauta-ids.yaml — реестр пространств имён идентификаторов и монотонной выдачи номера
# (ADR-038; схема — §3 ADR-038-spec в дереве плагина). Читатели — `scripts/id-check.sh`
# (входит в payload, с DEV-019 подключён к `scripts/check.sh --full`) и `scripts/next-id.sh`.
# Писатель — роль руками либо `next-id.sh`.
#
# ПРОВИЖИНИНГ — `bin/init.sh` (DEV-025, NA-EPIC-11), тот же протокол, что у `content/` и
# `.nauta-gates.yaml`: файл создаётся один раз, там, где его нет; существующий не трогается
# и не дописывается. В payload `bin/deliver.sh` этот файл НЕ входит осознанно (ADR-031 Д1,
# ADR-041 Д1): доставка идёт по SHA-провенансу и затирала бы реестр при каждом синке, а
# реестр растёт с каждым выданным номером — потеря `highwater` означала бы повторную выдачу.
#
# СТАРТОВОЕ СОСТОЯНИЕ — ПУСТОЙ КОРПУС, И ЭТО ОБЪЯВЛЕНО, А НЕ УМОЛЧАНО. У каждой записи
# `populated: false`: в дереве сразу после `/nauta:init` нет ни одной статьи, и ноль
# определений здесь — истинное утверждение о корпусе, а не «разбор не справился» (Д8
# ADR-038, §4.1a спеки). `highwater: 0` у обеих `allocated`-записей означает «ни один номер
# ещё не выдан»: первая выдача `bash scripts/next-id.sh adr` даст 001. Ставить сюда число
# донора было бы переносом чужого замера — первый же прогон гейта назвал бы расхождение.
#
# КАК ЭТО РАСТЁТ. Завёл первую статью раздела — сними `populated: false` в его записи тем же
# коммитом. Тогда «ноль определений» перестаёт быть законной тишиной и становится «не смог
# проверить» (§4.3 п.7): гейт больше не напечатает «чисто» на корпусе, который перестал
# разбираться.
#
# ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ. Пространства эпиков и backlog'а плагина (`NA-EPIC-`, `TPL-`) —
# пространства РЕПОЗИТОРИЯ-ДОНОРА: их префиксы и файлы-дома принадлежат `nauta`, у твоего
# проекта они другие. Копия сюда была бы объявлением без предмета. Заведи своё, когда
# заведёшь первый эпик — образец в конце файла.
namespaces:
  # Дом появляется вместе с первым решением: `/nauta:sa adr <решение>` создаёт
  # `content/00-project/adr/` вместе с его `_index.md` (правило скаффолда, ADR-041; C1
  # `validate-content.py` ловит подкаталог без индекса громко). До этого момента glob
  # пуст — это и есть объявленная пустота.
  - namespace: adr
    prefix: "ADR-"
    width: 3
    home: ["content/00-project/adr/ADR-*.md"]
    definition: filename-prefix
    scope: namespace
    allocation: allocated
    populated: true
    highwater: 22
    # Кладбище отменённых номеров — индекс раздела ADR (`- ADR-007 — отменён, …`).
    # Проверка невозврата читает его только когда в `home` есть хотя бы одно определение,
    # то есть ровно тогда, когда `_index.md` уже обязан существовать.
    graveyard: content/00-project/adr/_index.md

  - namespace: res
    prefix: "RES-"
    width: 3
    home: ["content/10-domain/research/*.md"]
    definition: h1-suffix
    scope: namespace
    allocation: allocated
    populated: false
    highwater: 0

  # `scope: file` — пространство имён есть ФАЙЛ требования (Д7 ADR-038): `AC-001` в двух
  # разных требованиях законны и коллизией не считаются. `closed` — новых номеров реестр не
  # выдаёт: машинно-проверяемый контракт живёт как `#### Scenario:` в
  # `openspec/specs/<capability>/spec.md`, а не как растущая нумерация.
  - namespace: ac
    prefix: "AC-"
    width: 3
    home: ["content/30-requirements/*.md"]
    definition: list-or-row-head
    scope: file
    allocation: closed
    populated: false

  # `Д1`, `Д2` … внутри ADR. `derived` — номер выводится из позиции пункта в решении, не
  # выдаётся аллокатором. Однобуквенный префикс намеренно ограничен домом ADR: полнотекстовый
  # обход дал бы лавину ложных совпадений на любом слове с этой буквы.
  - namespace: decision-clause
    prefix: "Д"
    width: 1
    home: ["content/00-project/adr/ADR-*.md"]
    definition: list-or-row-head
    scope: file
    allocation: derived
    populated: false

  # Пустой `prefix` — по построению: ключ сценария выводится из текста заголовка, номера у
  # него нет вовсе. Поэтому `populated: false` здесь ИНВАРИАНТ, а не долг (§4.1a): снимать
  # его не нужно даже когда в `openspec/specs/` появятся сотни сценариев. Запись объявлена
  # ради полноты границ — чтобы гейт не принялся считать заголовки сценариев номерами.
  - namespace: scenario
    prefix: ""
    width: 0
    home: ["openspec/specs/*/spec.md"]
    definition: list-or-row-head
    scope: namespace
    allocation: derived
    populated: false

  # `external` + пустой `home`: идентификаторы задач (`DEV-007`, `SA-003`) живут в сторе
  # задач, а не в `content/`. Объявление нужно именно затем, чтобы гейт не принял `SA-003` в
  # шапке статьи за определение в документарном контуре.
  - namespace: task
    prefix: ""
    width: 0
    home: []
    definition: list-or-row-head
    scope: namespace
    allocation: external
    populated: false

# Образец записи под эпики твоего проекта. Раскомментируй и подставь СВОЙ префикс, когда
# заведёшь `content/00-project/roadmap.md` и первый эпик в нём. Заготовка закомментирована
# намеренно: объявленное пространство без предмета — фикция, гейт обязан проверять то, что
# в дереве есть.
#
#  - namespace: epic
#    prefix: "XX-EPIC-"        # префикс проекта, не донора
#    width: 2
#    home: ["content/00-project/roadmap.md"]
#    definition: list-or-row-head   # снимает заголовок, ТЕКСТ которого открыт идентификатором
#                                   # («## XX-EPIC-01 — …»). Форма «id в скобках в середине
#                                   # заголовка» (heading-anchored, §4.1 ADR-038-spec) в
#                                   # матчере ещё не заведена — пиши эпики первой формой.
#    scope: namespace
#    allocation: allocated
#    populated: false
#    highwater: 0
